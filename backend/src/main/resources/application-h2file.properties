# Perfil "h2file": base de dados H2 guardada num ficheiro (pasta data/ dentro de backend).
# Os dados FICAM guardados quando o backend é desligado e voltado a ligar.
# Arrancar com: ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2file
spring.datasource.url=jdbc:h2:file:./data/studymatch
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
