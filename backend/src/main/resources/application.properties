spring.application.name=studymatch-backend
server.port=8080

# Ligação ao PostgreSQL (valores por omissão = docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studymatch}
spring.datasource.username=${DB_USER:studymatch}
spring.datasource.password=${DB_PASSWORD:studymatch}

# O esquema é gerado a partir das entidades (fase inicial do projeto)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
